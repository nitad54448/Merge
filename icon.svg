<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2316" />
      <stop offset="100%" stop-color="#140c08" />
    </linearGradient>
    <linearGradient id="catFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="woodTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="jewelTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6" />

  <!-- Cute RedCat ears & forehead peeking above the top gold block -->
  <path d="M168 134 L190 54 L238 106 Z" fill="url(#catFur)" stroke="#7c2d12" stroke-width="5" stroke-linejoin="round" />
  <path d="M344 134 L322 54 L274 106 Z" fill="url(#catFur)" stroke="#7c2d12" stroke-width="5" stroke-linejoin="round" />
  <path d="M180 124 L194 74 L224 108 Z" fill="#fed7aa" opacity="0.7" />
  <path d="M332 124 L318 74 L288 108 Z" fill="#fed7aa" opacity="0.7" />
  <ellipse cx="256" cy="126" rx="82" ry="42" fill="url(#catFur)" />
  <!-- Cat eyes -->
  <circle cx="222" cy="118" r="9" fill="#140c08" />
  <circle cx="290" cy="118" r="9" fill="#140c08" />
  <circle cx="225" cy="115" r="3" fill="#ffffff" />
  <circle cx="293" cy="115" r="3" fill="#ffffff" />
  <polygon points="256,129 249,122 263,122" fill="#fda4af" />

  <!-- Bottom pair of merging 64 blocks -->
  <rect x="66" y="284" width="166" height="166" rx="30" fill="#451a03" transform="translate(0, 6)" />
  <rect x="66" y="284" width="166" height="166" rx="30" fill="url(#woodTile)" stroke="#fbbf24" stroke-width="4" />
  <path d="M84 328 Q149 316 214 330" fill="none" stroke="#fef3c7" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round" />
  <text x="149" y="392" text-anchor="middle" fill="#fffbeb" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76">64</text>

  <rect x="280" y="284" width="166" height="166" rx="30" fill="#0f172a" transform="translate(0, 6)" />
  <rect x="280" y="284" width="166" height="166" rx="30" fill="url(#jewelTile)" stroke="#7dd3fc" stroke-width="4" />
  <polygon points="300,302 426,302 408,332 318,332" fill="#ffffff" opacity="0.24" />
  <text x="363" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76">64</text>

  <!-- Merged 128 Gold Tile in center-top -->
  <rect x="172" y="136" width="168" height="146" rx="30" fill="#713f12" transform="translate(0, 6)" />
  <rect x="172" y="136" width="168" height="146" rx="30" fill="url(#goldTile)" stroke="#fef08a" stroke-width="5" />
  <rect x="184" y="146" width="144" height="44" rx="16" fill="#ffffff" opacity="0.22" />
  <text x="256" y="232" text-anchor="middle" fill="#422006" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72">128</text>
  <text x="256" y="229" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72">128</text>

  <!-- Merge arrow -->
  <path d="M222 296 L256 266 L290 296" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
